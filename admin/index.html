<header class="topbar">
  <a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Practice dashboard <small>· David Steinberg, PhD, LCSW</small></a>

<div id="app"></div>

<template id="t-signin">

    <div class="card">
      <div class="mark-lg" aria-hidden="true"></div>

      <p><button class="btn primary" id="signin" type="button">Sign in with Google</button></p>

  </section>
</template>

  <div class="shell">
