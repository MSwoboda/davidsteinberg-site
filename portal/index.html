<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>Client portal — David Steinberg, PhD, LCSW</title>
<link rel="stylesheet" href="../app/ui.css?v=202610291442">
<script src="../app/firebase-config.js?v=202610291442"></script>
<script src="../app/api.js?v=202610291442"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Client portal <small>· David Steinberg, PhD, LCSW</small></a>
  <span class="spacer"></span>
  <div class="who" id="who" hidden><span class="avatar" id="who-avatar"></span><span id="who-name"></span><button class="btn quiet sm" id="signout" type="button">Sign out</button></div>
  <button class="theme-toggle" id="theme" type="button" aria-label="Switch between light and dark mode"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</header>

<main id="view" class="wrap narrow"></main>

<template id="t-signin">
  <section class="signin">
    <div class="card">
      <div class="mark-lg" aria-hidden="true"></div>
      <h1>Your space between sessions</h1>
      <p class="muted">Questionnaires, your next appointment, and what you are working on. Sign in with the Google account you gave David.</p>
      <p><button class="btn primary gbtn" id="signin" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.8 35.4 44 30.1 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button></p>
      <p class="small muted">Your name is not stored with your answers. The portal knows you by a pseudonym it assigns on first sign-in.</p>
      <p class="small"><a href="../#page/privacy">How your information is handled</a></p>
    </div>
  </section>
</template>

<template id="t-welcome">
  <section class="card">
    <p class="kicker">Welcome</p>
    <h1>In here, you are <span data-pseudonym></span>.</h1>
    <p>The portal keeps your answers under that name, not yours. David knows who it belongs to; nothing else here does. You will see it at the top of every page.</p>
    <p>Your account is waiting for David to confirm it, which he does after your first call. Questionnaires appear here once he assigns them.</p>
    <p><button class="btn primary" data-continue type="button">Continue</button></p>
  </section>
</template>

<template id="t-home">
  <div class="row between" style="margin-bottom:18px">
    <div><p class="kicker">Signed in as</p><h1 data-pseudonym></h1></div>
    <span class="chip" data-status></span>
  </div>
  <div class="grid two" style="margin-bottom:16px">
    <section class="card">
      <p class="kicker">Next appointment</p>
      <h2 data-next>Not scheduled yet</h2>
      <p class="muted small">Appointments are set by phone or in session. Call 215-253-4473 to change one.</p>
    </section>
    <section class="card">
      <p class="kicker">Working on</p>
      <h2 data-focus>—</h2>
      <p class="muted small">What David noted from your last session.</p>
    </section>
  </div>
  <section class="card">
    <div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Questionnaires</h2><span class="muted small" data-qcount></span></div>
    <div class="q-list" data-qlist></div>
    <div class="empty" data-qempty hidden>Nothing assigned yet. David adds questionnaires after your first session.</div>
  </section>
  <section class="card soft" style="margin-top:16px">
    <p class="kicker">In crisis?</p>
    <p style="margin:0">This portal is not monitored around the clock. Call or text <strong>988</strong> or go to the nearest emergency room.</p>
  </section>
</template>

<template id="t-questionnaire">
  <p><a class="btn quiet" href="#" data-back>← Back</a></p>
  <section class="card">
    <p class="kicker" data-kind></p>
    <h1 data-title></h1>
    <p class="muted" data-instructions></p>
    <div class="q-progress"><i data-progress style="width:0"></i></div>
    <form data-form novalidate></form>
    <div class="row" style="margin-top:18px; gap: 10px">
      <button class="btn primary" type="button" data-submit>Submit answers</button>
      <button class="btn" type="button" data-save>Save and finish later</button>
      <span class="muted small" data-saved></span>
    </div>
  </section>
</template>

<template id="t-done">
  <section class="card">
    <p class="kicker">Submitted</p>
    <h1>Thank you.</h1>
    <p>Your answers are saved for David to review before your next session. <span data-score></span></p>
    <p class="row"><a class="btn primary" href="#">Back to the portal</a><button class="btn" type="button" data-retake hidden>Answer it again</button></p>
    <p class="muted small" data-retake-note hidden>Answering again keeps your earlier answers so you and David can see what changed.</p>
  </section>
</template>

<script src="portal.js?v=202610291442"></script>
</body>
</html>
